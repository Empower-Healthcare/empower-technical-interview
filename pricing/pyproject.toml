[project]
name = "parcellab-pricing"
version = "0.1.0"
description = "ParcelLab pricing service: deterministic parcel quotes over HTTP/JSON."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "prometheus-client>=0.20,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
